<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AES-CBC</title>
    <link rel="icon" type="image/png" href="../logo.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <div class="header-brand">
        <a href="index.html">
          <img src="../logo.png" alt="Logo" class="logo" />
        </a>
      </div>
      <nav class="nav">
        <a href="index.html">Trang chủ</a>
        <a href="rsa.html">1. RSA</a>
        <a href="aes.html" class="active">2. AES-CBC</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>2. AES-CBC</h2>
        <p class="desc">
          Mã hóa khối đối xứng dùng chung một khóa bí mật, kết hợp chế độ Cipher Block Chaining (CBC) và Vector khởi tạo (IV).
        </p>

        <label for="aes-direction">Chiều xử lý</label>
        <select id="aes-direction">
          <option value="encrypt">Mã hóa</option>
          <option value="decrypt">Giải mã</option>
        </select>

        <label for="aes-key">SECRET KEY</label>
        <input id="aes-key" value="bi-mat-cua-toi" />

        <label id="aes-input-label" for="aes-input">PLAINTEXT</label>
        <textarea id="aes-input">Hello AES-CBC</textarea>

        <button id="aes-run" type="button" class="btn btn-primary">Mã hóa AES-CBC</button>

        <label>Kết quả</label>
        <div id="aes-result" class="output"></div>
        <p id="aes-status" role="status"></p>
      </section>
    </main>

    <script>
      'use strict';

      const API_URL = '/api/crypto';
      const $ = (id) => document.getElementById(id);

      const keyEl = $('aes-key');
      const directionEl = $('aes-direction');
      const inputLabelEl = $('aes-input-label');
      const inputEl = $('aes-input');
      const runBtn = $('aes-run');
      const resultEl = $('aes-result');
      const statusEl = $('aes-status');

      async function callCryptoApi(action, payload) {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, payload }),
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || `Yêu cầu thất bại (${response.status})`);
        }

        return result;
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function showError(error) {
        alert(error?.message || 'Đã xảy ra lỗi.');
      }

      function updateRunButton() {
        runBtn.disabled = !keyEl.value.trim();
      }

      function handleDirectionChange() {
        const isEncrypt = directionEl.value === 'encrypt';

        inputLabelEl.textContent = isEncrypt ? 'PLAINTEXT' : 'CIPHERTEXT';
        runBtn.textContent = isEncrypt ? 'Mã hóa AES-CBC' : 'Giải mã AES-CBC';
        inputEl.placeholder = isEncrypt ? 'Hello AES-CBC' : 'IV:ciphertext';

        if (resultEl.textContent) {
          inputEl.value = resultEl.textContent;
        }

        updateRunButton();
      }

      async function handleRun() {
        const isEncrypt = directionEl.value === 'encrypt';
        const key = keyEl.value;

        if (!key.trim()) {
          showError(new Error('Cần nhập SECRET KEY.'));
          return;
        }

        runBtn.disabled = true;
        setStatus(isEncrypt ? 'Đang mã hóa…' : 'Đang giải mã…');

        try {
          const payload = isEncrypt
            ? { secretKey: key, plaintext: inputEl.value }
            : { secretKey: key, ciphertext: inputEl.value };
          const result = await callCryptoApi(isEncrypt ? 'aes-encrypt' : 'aes-decrypt', payload);

          resultEl.textContent = isEncrypt ? result.ciphertext : result.plaintext;
          setStatus(isEncrypt ? 'Đã mã hóa AES-CBC.' : 'Đã giải mã AES-CBC.');
        } catch (error) {
          showError(error);
        } finally {
          updateRunButton();
        }
      }

      keyEl.addEventListener('input', updateRunButton);
      directionEl.addEventListener('change', handleDirectionChange);
      runBtn.addEventListener('click', handleRun);

      handleDirectionChange();
    </script>
  </body>
</html>
