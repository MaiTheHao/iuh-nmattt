<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSA</title>
    <link rel="icon" type="image/png" href="../logo.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <div class="header-brand">
        <a href="index.html">
          <img src="../logo.png" alt="Logo" class="logo" />
        </a>
      </div>
      <nav class="nav">
        <a href="index.html">Trang chủ</a>
        <a href="rsa.html" class="active">1. RSA</a>
        <a href="aes.html">2. AES-CBC</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>1. RSA — 2048 bit</h2>
        <p class="desc">
          Mã hóa và giải mã sử dụng cặp khóa công khai (Public Key) và khóa bí mật (Secret Key).
        </p>

        <label for="rsa-key-mode">Sinh khóa</label>
        <select id="rsa-key-mode">
          <option value="auto">Tự động</option>
          <option value="manual">Nhập thủ công</option>
        </select>

        <label for="rsa-public-key">PUBLIC KEY</label>
        <textarea id="rsa-public-key" readonly></textarea>

        <label for="rsa-secret-key">SECRET KEY</label>
        <textarea id="rsa-secret-key" readonly></textarea>

        <button id="rsa-generate-keys" type="button" class="btn btn-secondary">Tạo lại cặp khóa RSA</button>

        <label for="rsa-direction">Chiều xử lý</label>
        <select id="rsa-direction">
          <option value="encrypt">Mã hóa</option>
          <option value="decrypt">Giải mã</option>
        </select>

        <label id="rsa-input-label" for="rsa-input">PLAINTEXT</label>
        <textarea id="rsa-input">HELLO RSA</textarea>

        <button id="rsa-run" type="button" class="btn btn-primary" disabled>Mã hóa RSA</button>

        <label>Kết quả</label>
        <div id="rsa-result" class="output"></div>
        <p id="rsa-status" role="status"></p>
      </section>
    </main>

    <script>
      'use strict';

      const API_URL = '/api/crypto';
      const $ = (id) => document.getElementById(id);

      async function callCryptoApi(action, payload) {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, payload }),
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || `Yêu cầu thất bại (${response.status})`);
        }
        return result;
      }

      function setStatus(message) {
        const el = $('rsa-status');
        if (el) el.textContent = message;
      }

      function showError(error) {
        const message = error?.message || 'Đã xảy ra lỗi.';
        alert(message.includes('DECODER routines::unsupported') ? 'Khóa RSA không hợp lệ.' : message);
      }

      function toBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      async function createRsaKeyPair() {
        const pair = await crypto.subtle.generateKey(
          {
            name: 'RSA-OAEP',
            modulusLength: 2048,
            publicExponent: Uint8Array.of(1, 0, 1),
            hash: 'SHA-256',
          },
          true,
          ['encrypt', 'decrypt'],
        );

        return {
          publicKey: toBase64(await crypto.subtle.exportKey('spki', pair.publicKey)),
          secretKey: toBase64(await crypto.subtle.exportKey('pkcs8', pair.privateKey)),
        };
      }

      const keyModeEl = $('rsa-key-mode');
      const publicKeyEl = $('rsa-public-key');
      const secretKeyEl = $('rsa-secret-key');
      const generateBtn = $('rsa-generate-keys');
      const directionEl = $('rsa-direction');
      const inputLabelEl = $('rsa-input-label');
      const inputEl = $('rsa-input');
      const runBtn = $('rsa-run');
      const resultEl = $('rsa-result');

      function updateRunButtonState() {
        const isEncrypt = directionEl.value === 'encrypt';
        const key = isEncrypt ? publicKeyEl.value : secretKeyEl.value;
        runBtn.disabled = !key || !key.trim();
      }

      async function generateKeys() {
        generateBtn.disabled = true;
        keyModeEl.disabled = true;
        publicKeyEl.value = '';
        secretKeyEl.value = '';
        updateRunButtonState();

        try {
          const pair = await createRsaKeyPair();
          publicKeyEl.value = pair.publicKey;
          secretKeyEl.value = pair.secretKey;
        } catch {
          alert('Không tạo được cặp khóa RSA trong trình duyệt này.');
        } finally {
          generateBtn.disabled = false;
          keyModeEl.disabled = false;
          updateRunButtonState();
        }
      }

      function handleKeyModeChange() {
        const isAuto = keyModeEl.value === 'auto';
        publicKeyEl.readOnly = isAuto;
        secretKeyEl.readOnly = isAuto;
        publicKeyEl.placeholder = isAuto ? '' : 'Nhập public key';
        secretKeyEl.placeholder = isAuto ? '' : 'Nhập secret key';
        generateBtn.hidden = !isAuto;

        if (isAuto) {
          generateKeys();
        } else {
          publicKeyEl.value = '';
          secretKeyEl.value = '';
          updateRunButtonState();
        }
      }

      function handleDirectionChange() {
        const isEncrypt = directionEl.value === 'encrypt';
        inputLabelEl.textContent = isEncrypt ? 'PLAINTEXT' : 'CIPHERTEXT';
        runBtn.textContent = isEncrypt ? 'Mã hóa RSA' : 'Giải mã RSA';
        if (resultEl.textContent) {
          inputEl.value = resultEl.textContent;
        }
        updateRunButtonState();
      }

      async function handleRun() {
        const isEncrypt = directionEl.value === 'encrypt';
        const key = isEncrypt ? publicKeyEl.value : secretKeyEl.value;
        if (!key.trim()) {
          return alert(isEncrypt ? 'Cần nhập PUBLIC KEY.' : 'Cần nhập SECRET KEY.');
        }

        runBtn.disabled = true;
        setStatus(isEncrypt ? 'Đang mã hóa…' : 'Đang giải mã…');
        try {
          const payload = isEncrypt
            ? { key, plaintext: inputEl.value }
            : { key, ciphertext: inputEl.value };
          const result = await callCryptoApi(isEncrypt ? 'rsa-encrypt' : 'rsa-decrypt', payload);
          resultEl.textContent = isEncrypt ? result.ciphertext.join(' ') : result.plaintext;
          setStatus(isEncrypt ? 'Đã mã hóa RSA.' : 'Đã giải mã RSA.');
        } catch (error) {
          showError(error);
        } finally {
          updateRunButtonState();
        }
      }

      keyModeEl.addEventListener('change', handleKeyModeChange);
      generateBtn.addEventListener('click', generateKeys);
      publicKeyEl.addEventListener('input', updateRunButtonState);
      secretKeyEl.addEventListener('input', updateRunButtonState);
      directionEl.addEventListener('change', handleDirectionChange);
      runBtn.addEventListener('click', handleRun);

      handleDirectionChange();
      generateKeys();
    </script>
  </body>
</html>
